[package]
name = "arqhia_p"
version = "0.9.5"
edition = "2024"

[dependencies]
iced = { version = "0.13", features = ["tokio", "markdown"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
rfd = "0.15"
minijinja = "2"
walkdir = "2"
directories = "6"

[dev-dependencies]
tempfile = "3"
